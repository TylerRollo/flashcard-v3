name: flashcard-v3

services:
  frontend:
    container_name: frontend
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - REACT_APP_API_URL=
    depends_on:
      - backend
    networks:
      - three-tier-net

  backend:
    container_name: backend
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - host=${DB_HOST:-db}
      - user=${DB_USER:-root}
      - password=${DB_PASSWORD}
      - database=${DB_NAME:-flashcard_db}
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - three-tier-net

  db:
    container_name: mysql-container
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-flashcard_db}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - three-tier-net

  # Uncomment once you attach a domain on Cloudflare and set TUNNEL_TOKEN in .env:
  # cloudflared:
  #   container_name: cloudflared
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
  #   depends_on:
  #     - frontend
  #   networks:
  #     - three-tier-net

volumes:
  mysql-data:

networks:
  three-tier-net:
    name: three-tier-net
    driver: bridge