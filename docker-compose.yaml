services:
  frontend:
    container_name: frontend
    build:
      context: ./front-end
    image: ${REGISTRY_PREFIX:-local}/flashcard-frontend:latest
    ports:
      - "80:80"
    environment:
      - HOST=0.0.0.0
      - PORT=80
      - REACT_APP_API_URL=
    depends_on:
      - backend
    networks:
      - three-tier-net

  backend:
    container_name: backend
    build:
      context: ./back-end
    image: ${REGISTRY_PREFIX:-local}/flashcard-backend:latest
    ports:
      - "5000:5000"
    environment:
      - host=${host:-db}
      - user=${user:-root}
      - password=${password:-mysql123}
      - database=${database:-flashcard_db}
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - three-tier-net

  db:
    container_name: mysql-container
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-mysql123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-flashcard_db}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql123}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - three-tier-net

volumes:
  mysql-data:

networks:
  three-tier-net:
    name: three-tier-net
    driver: bridge